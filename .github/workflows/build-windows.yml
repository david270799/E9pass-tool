name: Build Windows installer

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      APP_VERSION: "0.2.${{ github.run_number }}"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Download OCR models
        run: python tools/download_models.py

      - name: Build app (PyInstaller)
        run: >
          pyinstaller --noconfirm --windowed --name E9pay
          --icon e9pass/assets/logo.ico
          --add-data "e9pass/assets;e9pass/assets"
          --collect-all easyocr --collect-all torchvision --collect-all pymupdf --collect-all pikepdf
          --collect-submodules pillow_heif --collect-submodules skimage
          --exclude-module tkinter --exclude-module matplotlib
          main.py

      - name: Add models and self-test sample
        shell: pwsh
        run: |
          Copy-Item -Recurse models dist/E9pay/models
          New-Item -ItemType Directory -Force dist/E9pay/selftest | Out-Null
          Copy-Item tests/fixtures/sample_front.jpg dist/E9pay/selftest/
          "{0:N0} MB" -f ((Get-ChildItem dist/E9pay -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Self-test the built exe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist/E9pay/E9pay.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP/e9pay_selftest.log"
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$env:APP_VERSION installer/E9pay.iss
          Get-ChildItem dist/*.exe | ForEach-Object { "{0}  {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: E9pay-Setup
          path: dist/E9pay-Setup-*.exe
          retention-days: 30
          compression-level: 0

      - name: Publish to "latest-build" pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag 2>$null
          $exe = (Get-ChildItem dist/E9pay-Setup-*.exe).FullName
          gh release create latest-build $exe --prerelease --target $env:GITHUB_SHA `
            --title "E9pay $env:APP_VERSION (тестовая сборка)" `
            --notes "Установщик для Windows 10/11 (64-bit). Собран автоматически из ветки $env:GITHUB_REF_NAME."
